<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Intimacy D20 Journey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background-color: #020617;
      color: #e5e7eb;
    }

    /* Strong phase color themes */

    body.phase-1 {
      background: radial-gradient(circle at top, #0f172a 0, #020617 55%, #000 100%);
    }

    body.phase-2 {
      background: radial-gradient(circle at top, #1e1b4b 0, #020617 55%, #000 100%);
    }

    body.phase-3 {
      background: radial-gradient(circle at top, #4a044e 0, #020617 55%, #000 100%);
    }

    body.phase-1 .card {
      border-color: #3b82f6;
      box-shadow: 0 18px 40px rgba(37, 99, 235, 0.45);
    }

    body.phase-2 .card {
      border-color: #a855f7;
      box-shadow: 0 18px 40px rgba(168, 85, 247, 0.45);
    }

    body.phase-3 .card {
      border-color: #ec4899;
      box-shadow: 0 18px 40px rgba(236, 72, 153, 0.5);
    }

    body.phase-1 .primary {
      background: linear-gradient(to right, #3b82f6, #22c55e);
    }

    body.phase-2 .primary {
      background: linear-gradient(to right, #a855f7, #22c55e);
    }

    body.phase-3 .primary {
      background: linear-gradient(to right, #ec4899, #22c55e);
    }

    .page {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background-color: #020617;
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.9);
      border: 1px solid #1f2937;
    }

    .card + .card {
      margin-top: 1rem;
    }

    .card-header {
      margin-bottom: 0.75rem;
    }

    .card-header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .card-header p {
      margin: 0.25rem 0 0;
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    label {
      font-size: 0.9rem;
      color: #d1d5db;
    }

    input[type="number"] {
      width: 4rem;
      padding: 0.25rem 0.4rem;
      border-radius: 0.375rem;
      border: 1px solid #4b5563;
      background-color: #020617;
      color: #e5e7eb;
      font-size: 0.9rem;
    }

    button {
      border: none;
      border-radius: 0.375rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .primary {
      color: #020617;
      font-weight: 600;
    }

    .secondary {
      background-color: #020617;
      color: #e5e7eb;
      border: 1px solid #4b5563;
    }

    .danger {
      background-color: #7f1d1d;
      color: #fee2e2;
    }

    .output {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      background-color: #020617;
      border: 1px solid #111827;
      min-height: 3rem;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .message {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #a7f3d0;
      border-radius: 0.5rem;
      padding: 0.25rem 0.4rem;
    }

    .error {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #fecaca;
    }

    select {
      background-color: #020617;
      color: #e5e7eb;
      border-radius: 0.375rem;
      border: 1px solid #4b5563;
      padding: 0.2rem 0.6rem;
      font-size: 0.9rem;
    }

    .section-subtitle {
      margin: 0.75rem 0 0.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #e5e7eb;
    }

    .summary-list {
      margin: 0;
      padding-left: 1.25rem;
      font-size: 0.88rem;
      line-height: 1.45;
      color: #d1d5db;
      max-height: 220px;
      overflow-y: auto;
    }

    .summary-list li + li {
      margin-top: 0.18rem;
    }

    #summaryCard .card-body {
      border-top: 1px solid #111827;
      padding-top: 0.75rem;
    }

    .summary-section {
      border-radius: 0.5rem;
      border: 1px solid #1f2937;
      background-color: #020617;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
    }

    .summary-section:last-of-type {
      margin-bottom: 0;
    }

    .summary-section .section-subtitle {
      margin: 0 0 0.25rem;
    }

    /* Achievement flashes */

    .message.flash {
      animation: flash-ring 0.6s ease-out;
    }

    @keyframes flash-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.8);
      }
      100% {
        box-shadow: 0 0 0 14px rgba(34, 197, 94, 0);
      }
    }

    .message.repeat-flash {
      animation: repeat-ring 0.6s ease-out;
    }

    @keyframes repeat-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.8);
      }
      100% {
        box-shadow: 0 0 0 14px rgba(56, 189, 248, 0);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Main card -->
    <div class="card">
      <div class="card-header">
        <h1>Intimacy D20 Journey</h1>
        <p>
          Enter your two d20 rolls (location + action) and an optional d6 clothing roll for the current phase.
        </p>
      </div>

      <div class="row" style="margin-bottom: 0.5rem;">
        <label>Phase:</label>
        <span id="phaseDisplay">1</span>
        <span style="margin-left: 1rem;">Rounds this phase:</span>
        <span id="rollCountDisplay">0</span>
      </div>

      <div class="row" style="margin-bottom: 0.75rem;">
        <label for="locationRoll">Location roll (d20)</label>
        <input
          id="locationRoll"
          type="number"
          min="1"
          max="20"
          inputmode="numeric"
        />

        <label for="actionRoll">Action roll (d20)</label>
        <input
          id="actionRoll"
          type="number"
          min="1"
          max="20"
          inputmode="numeric"
        />

        <label for="clothingRoll">Clothing roll (d6)</label>
        <input
          id="clothingRoll"
          type="number"
          min="1"
          max="6"
          inputmode="numeric"
        />

        <button class="primary" id="submitRoll">🎲 Submit rolls</button>
        <button class="secondary danger" id="newSession">
          ♻️ New Session
        </button>
      </div>

      <!-- Clothing control -->
      <div class="row" style="margin-bottom: 0.75rem;">
        <button class="secondary" id="noClothingPrompts">
          🚪 All clothing removed – stop clothing prompts
        </button>
      </div>

      <!-- Timer controls -->
      <div class="row" style="margin-bottom: 0.75rem;">
        <label style="font-size: 0.85rem; color: #9ca3af;">⏱️ Action timer</label>
        <button class="secondary" id="timer30">30 sec</button>
        <button class="secondary" id="timer1">1 min</button>
        <button class="secondary" id="timer2">2 min</button>
        <button class="secondary" id="timer5">5 min</button>
        <span
          id="timerDisplay"
          style="margin-left: 0.5rem; font-size: 0.9rem;"
        >
          00:00
        </span>
      </div>

      <div class="row" style="margin-bottom: 0.5rem;">
        <button class="secondary" id="testSound">🔊 Play timer sound</button>
      </div>

      <div class="output"><strong>Where:</strong> <span id="whereOutput">—</span></div>
      <div class="output"><strong>What to do:</strong> <span id="whatOutput">—</span></div>
      <div class="output"><strong>Clothing action:</strong> <span id="clothingOutput">—</span></div>

      <div id="message" class="message"></div>
      <div id="error" class="error"></div>

      <audio id="timerSound">
        <source src="timer-beep.wav" type="audio/mpeg" />
      </audio>
    </div>

    <!-- Summary card -->
    <div class="card" id="summaryCard">
      <div class="card-header">
        <h1>Current selections</h1>
      </div>

      <div class="card-body">
        <!-- Phase selector -->
        <div class="row" style="margin-bottom: 0.75rem;">
          <label for="phaseSelect" style="font-size: 0.9rem; margin-right: 0.5rem;">
            Phase:
          </label>
          <select id="phaseSelect">
            <option value="1">Phase 1</option>
            <option value="2">Phase 2</option>
            <option value="3">Phase 3</option>
          </select>
        </div>

        <!-- Locations list -->
        <div class="summary-section">
          <h4 class="section-subtitle">Locations</h4>
          <ul id="currentLocationsList" class="summary-list"></ul>
        </div>

        <!-- Actions list -->
        <div class="summary-section">
          <h4 class="section-subtitle">Actions</h4>
          <ul id="currentActionsList" class="summary-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="tables.js"></script>
  <script src="main.js"></script>
</body>
</html>
