# Build and push Docker images to GitHub Container Registry (ghcr.io).
# After this runs, "Pull and redeploy" in Portainer updates both app and TTS if the
# stack uses docker-compose.registry.yml with Re-pull image enabled.
name: Docker build and push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set GHCR image name (lowercase)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Build and push TTS server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tts
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:tts
            ${{ env.IMAGE_NAME }}:tts-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha
