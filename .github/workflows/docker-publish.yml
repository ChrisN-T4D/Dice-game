# Build and push Docker image to GitHub Container Registry (ghcr.io).
# After this runs, "Pull and redeploy" in Portainer will get the new image if the
# stack uses docker-compose.registry.yml and DICE_GAME_IMAGE=ghcr.io/OWNER/dice-game:latest.
name: Docker build and push

on:
  push:
    branches: [update-to-vue]   # change to main or your default branch if needed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha
