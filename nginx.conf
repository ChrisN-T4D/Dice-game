server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: fallback to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html so deploys are picked up without hard refresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Runtime config (e.g. TTS URL from HOST) — do not cache
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # WASM MIME type (do not override default mime.types)
    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000";
        default_type application/wasm;
    }

    # ES modules (.mjs) must be served as application/javascript or browsers block them
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # Headers for SharedArrayBuffer / COOP+COEP (used by app)
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "credentialless";

    # Optional: alias typo path used by some builds
    location /onnxe-wasm/ {
        alias /usr/share/nginx/html/onnxruntime-wasm/;
    }
}
